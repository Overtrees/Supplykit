name: Deploy Backend to PythonAnywhere

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  # 后端运行目标 Python 版本(语法门禁用)——迁移平台/升级版本时改此处即可
  BACKEND_PY_VERSION: "3.11"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11 语法门禁 (PA 运行版本)
        run: |
          set -e
          # 语法门禁: 以 BACKEND_PY_VERSION 为目标版本验证全项目兼容——防止新代码用更高版本语法(2026-09-04 事故根因: f-string嵌套引号3.12合法/3.11崩)
          PY="python${BACKEND_PY_VERSION}"
          if command -v "$PY" >/dev/null 2>&1; then
            TARGET_PY="$PY"
          elif command -v python3.12 >/dev/null; then
            TARGET_PY=python3.12
            echo "⚠️ 未找到 $PY(目标${BACKEND_PY_VERSION}), 用 3.12 兜底(风险: 3.12 合法/目标版本不合法语法无法拦截)"
          else
            echo "无合适 Python, 跳过门禁(风险接受)"
            exit 0
          fi
          echo "语法门禁目标版本: ${BACKEND_PY_VERSION} (> ${TARGET_PY})"
          find backend/app -name '*.py' | while read f; do
            "$TARGET_PY" -m py_compile "$f" || { echo "❌ ${BACKEND_PY_VERSION} 语法失败: $f"; exit 1; }
          done
          echo "✅ Python ${BACKEND_PY_VERSION} 语法检查通过"

      - name: Upload backend files to PythonAnywhere
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_TOKEN }}
        run: |
          set -e
          FILES=$(find backend/app -name '*.py')
          for f in $FILES; do
            rel="${f#backend/}"
            url="https://www.pythonanywhere.com/api/v0/user/Overtrees/files/path/home/Overtrees/Supplykit/backend/$rel"
            code=""
            # 429 限流重试（最多 3 次），文件间延迟 1s
            for attempt in 1 2 3; do
              code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
                -H "Authorization: Token $PA_TOKEN" \
                -F "content=@$f" "$url")
              if [ "$code" = "429" ]; then
                echo "$rel → 429, 等待 ${attempt}0s 重试"
                sleep ${attempt}0
                continue
              fi
              break
            done
            echo "$rel → HTTP $code"
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "上传失败: $rel"
              exit 1
            fi
            sleep 1
          done

      - name: Reload webapp
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_TOKEN }}
        run: |
          # 注意: PA 免费版 reload 常返回 409/slow_startup/error 但实际已软重载成功——
          # 以后续 Health check 为准, reload 步骤不因 409 标失败(9-2 多 commit 误标失败沉淀)
          for i in $(seq 1 6); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Token $PA_TOKEN" \
              "https://www.pythonanywhere.com/api/v0/user/Overtrees/webapps/overtrees.pythonanywhere.com/reload/")
            echo "reload 尝试 $i → HTTP $code"
            # 2xx 视为提交成功; 409 slow_startup/5xx 等待重试(容忍性放宽, 由 health 兜底)
            case "$code" in
              2*) echo "reload 已提交 (HTTP $code)"; exit 0 ;;
            esac
            sleep 30
          done
          echo "reload 未确认 2xx, 交由 health check 验证实际状态"
          exit 0

      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "https://overtrees.pythonanywhere.com/api/health")
            echo "health 检查 $i → HTTP $code"
            if [ "$code" = "200" ]; then echo "部署成功"; exit 0; fi
            sleep 20
          done
          echo "health 检查失败"
          exit 1
