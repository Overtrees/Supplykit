name: Self-Heal Backend

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  check-and-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Check backend health
        id: health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://overtrees.pythonanywhere.com/api/health || echo "000")
          echo "health_code=$code"
          echo "code=$code" >> $GITHUB_OUTPUT
      - name: Reload backend if down
        if: steps.health.outputs.code != '200'
        run: |
          echo "后端无响应 (code=${{ steps.health.outputs.code }}), 触发 reload..."
          curl -s -X POST \
            -H "Authorization: Token ${{ secrets.PYTHONANYWHERE_TOKEN }}" \
            https://www.pythonanywhere.com/api/v0/user/Overtrees/webapps/overtrees.pythonanywhere.com/reload/ \
            -w "reload_http=%{http_code}\n"
          echo "已触发 reload"
