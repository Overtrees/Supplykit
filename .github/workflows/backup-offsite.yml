name: Backup Offsite (异地备份)

on:
  schedule:
    - cron: '30 2 * * *'   # 每日 02:30 UTC = 10:30 北京时间（PA 凌晨2点备份后拉取）
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 允许创建/更新 Release
    steps:
      - name: 拉取 PA 最新备份
        id: fetch
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_TOKEN }}
          PA_BASE: https://www.pythonanywhere.com/api/v0/user/Overtrees/files/path/home/Overtrees/Supplykit/backend/app
        run: |
          set -e
          # 1. 列目录(PA files API JSON), 用 grep 提取 .bak.*.gz 文件名
          curl -sS -H "Authorization: Token $PA_TOKEN" "$PA_BASE/" -o /tmp/palist.json
          BAK=$(grep -oE '"supplykit\.db\.bak\.[0-9]{8}\.gz"' /tmp/palist.json | sort -u | tail -1 | tr -d '"')
          if [ -z "$BAK" ]; then
            echo "❌ 未找到任何备份文件"
            exit 1
          fi
          echo "backup_file=$BAK"
          # 2. 下载
          code=$(curl -sS -H "Authorization: Token $PA_TOKEN" "$PA_BASE/$BAK" -o backup.gz -w "%{http_code}")
          echo "download http=$code size=$(stat -c%s backup.gz 2>/dev/null || echo ?)"
          test "$code" = "200" || { echo "下载失败"; exit 1; }
          # 3. 校验 gzip 完整
          gzip -t backup.gz && echo "gzip OK"
          DATE=$(echo "$BAK" | grep -oE '[0-9]{8}')
          echo "backup_date=$DATE" >> "$GITHUB_OUTPUT"

      - name: 上传到 GitHub Release（异地）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          DATE=$(grep -oE '[0-9]{8}' <<< "${{ steps.fetch.outputs.backup_date }}")
          TAG="backup-$DATE"
          echo "release tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release 已存在，更新资产"
            gh release upload "$TAG" backup.gz --clobber
          else
            gh release create "$TAG" backup.gz \
              --title "DB 备份 $DATE" \
              --notes "PA 数据库异地备份（自动生成）" || echo "创建失败(可能已存在), 忽略"
          fi
          echo "异地备份完成: $TAG"

      - name: 清理旧 Release（保留最近 7 份）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release list --limit 100 --json tagName,createdAt \
            --jq '.[] | select(.tagName|startswith("backup-")) | [.tagName,.createdAt] | @tsv' 2>/dev/null |
            sort -k2 -r |
            awk 'NR>7 {print $1}' |
            while read t; do
              echo "删除旧备份 release: $t"
              gh release delete "$t" --yes 2>/dev/null || true
            done
          echo "清理完成"